plugins {
    id 'com.android.application' version '8.6.1' apply false
    id 'com.android.library' version '8.6.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
}
allprojects {
    repositories {
        google(); mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
        maven { url rootProject.file('../dist/maven') }
    }
    configurations.configureEach {
        resolutionStrategy.force 'com.facebook.react:react-android:0.76.9'
    }
}
project(':flutter-plugin') {
    afterEvaluate {
        dependencies {
            compileOnly 'io.flutter:flutter_embedding_debug:1.0.0-c29809135135e262a912cf583b2c90deb9ded610'
        }
    }
}
